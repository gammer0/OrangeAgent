[project]
name = "orange"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "openai>=3.33.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
orange = "orange.cli:main"

[tool.hatch.build.targets.wheel]
# ``apps`` carries the FastAPI layer; ``src/orange/web`` sits inside the orange
# package already, so it ships automatically with the wheel.
packages = ["src/orange", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201"]
