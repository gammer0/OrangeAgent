<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ANCHOR: Retro-Futuristic (synthwave branch)
     Surface  pitch black-violet #0A0014
     Type     Space Mono (body) / Orbitron (display)
     Signal   neon pair — magenta #FF006E + cyan #00FFFF
     Texture  CRT scanlines via ::before repeating-linear-gradient
     ============================================================ */
  :root {
    --bg: #0A0014;
    --panel: #12001F;
    --panel-2: #1B002C;
    --line: #33114D;
    --line-2: #4A1A6B;
    --text: #EADCF5;
    --muted: #9A7DB5;
    --faint: #6B4C85;
    --pink: #FF006E;
    --pink-dim: #FF006E33;
    --cyan: #00FFFF;
    --cyan-dim: #00FFFF2E;
    --err: #FF3B6B;
    --mono: "Space Mono", "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --display: "Orbitron", "Space Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.6 var(--mono);
    font-variant-numeric: tabular-nums;
    display: grid; grid-template-columns: 272px 1fr 348px;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "head head head" "sessions chat side";
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  /* CRT scanlines over the whole surface */
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 0, 110, 0.045) 0px,
      rgba(255, 0, 110, 0.045) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
  }
  ::selection { background: var(--pink); color: #000; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--pink); }

  /* ---- Header ---- */
  header {
    grid-area: head; display: flex; align-items: center; gap: 14px;
    padding: 0 16px; background: var(--panel);
    border-bottom: 1px solid var(--line-2);
    box-shadow: 0 1px 0 var(--pink-dim), 0 2px 18px -8px var(--pink);
    position: relative; z-index: 2;
  }
  header h1 {
    font-family: var(--display);
    font-size: 13px; margin: 0; font-weight: 700;
    letter-spacing: .26em; text-transform: uppercase;
    color: var(--text);
    text-shadow: 0 0 8px var(--pink), 0 0 22px var(--pink-dim);
  }
  .dot {
    width: 7px; height: 7px; background: var(--faint);
  }
  .dot.ok {
    background: var(--cyan);
    box-shadow: 0 0 6px var(--cyan), 0 0 14px var(--cyan-dim);
  }
  .dot.err {
    background: var(--err);
    box-shadow: 0 0 6px var(--err), 0 0 14px #FF3B6B44;
  }
  .spacer { flex: 1; }
  select, button, input, textarea {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 0; padding: 7px 10px;
    outline: none;
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 1px var(--pink-dim), 0 0 12px -4px var(--pink);
  }
  button {
    cursor: pointer; text-transform: uppercase; letter-spacing: .12em;
    font-size: 11px; transition: background .14s, color .14s, border-color .14s, box-shadow .14s;
  }
  button:hover:not(:disabled) {
    border-color: var(--pink); color: var(--pink);
    box-shadow: 0 0 12px -4px var(--pink);
  }
  button:disabled { opacity: .32; cursor: not-allowed; }
  button.primary {
    background: var(--pink); border-color: var(--pink); color: #0A0014; font-weight: 700;
    box-shadow: 0 0 16px -4px var(--pink);
  }
  button.primary:hover:not(:disabled) {
    background: #FF2E88; color: #0A0014;
    box-shadow: 0 0 22px -2px var(--pink);
  }
  button.danger { color: var(--cyan); border-color: var(--line); }
  button.danger:hover:not(:disabled) {
    border-color: var(--cyan); color: var(--cyan);
    box-shadow: 0 0 12px -4px var(--cyan);
  }
  label { text-transform: uppercase; letter-spacing: .14em; font-size: 10px; color: var(--faint); }

  /* ---- Sessions: sequenced ruler ---- */
  #sessions {
    grid-area: sessions; background: var(--panel); border-right: 1px solid var(--line-2);
    display: flex; flex-direction: column; min-height: 0;
  }
  #sessions .top {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #sessions .top .k {
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint);
  }
  #sessions .top .v { font-size: 11px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan-dim); }
  #session-list { overflow-y: auto; flex: 1; padding: 0; }
  .sess {
    position: relative; padding: 10px 12px 10px 66px; cursor: pointer;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
    transition: background .14s;
  }
  .sess:hover { background: var(--panel-2); }
  /* index number sits on a hairline rule, like a gauge channel mark */
  .sess::before {
    position: absolute; left: 10px; top: 0; bottom: 0; width: 38px;
    display: grid; place-items: center;
    font-family: var(--display);
    font-size: 15px; font-weight: 700; line-height: 1;
    color: var(--faint); letter-spacing: .02em;
    content: attr(data-idx);
    border-right: 1px solid var(--line);
    transition: color .14s, text-shadow .14s;
  }
  .sess:hover::before { color: var(--muted); }
  .sess.active { background: var(--panel-2); }
  .sess.active::before {
    color: var(--pink);
    text-shadow: 0 0 10px var(--pink), 0 0 24px var(--pink-dim);
  }
  .sess.active::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: linear-gradient(to bottom, var(--pink), var(--cyan));
    box-shadow: 0 0 10px var(--pink-dim);
  }
  .sess .id {
    font-size: 11px; flex: 1; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: var(--text);
  }
  .sess .st {
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); padding: 1px 5px;
    flex: none;
  }
  .sess .st.running {
    color: var(--pink); border-color: var(--pink);
    box-shadow: 0 0 10px -3px var(--pink);
  }
  .sess .st.done { color: var(--cyan); border-color: var(--line-2); }
  .sess .st.aborted { color: var(--muted); border-color: var(--line-2); }
  .sess .st.error {
    color: var(--err); border-color: var(--err);
    box-shadow: 0 0 10px -3px var(--err);
  }
  .sess .kill {
    opacity: 0; color: var(--muted); padding: 0 2px; background: none;
    border: none; font-size: 13px; line-height: 1; flex: none;
  }
  .sess .kill:hover { color: var(--pink); border: none; box-shadow: none; }
  .sess:hover .kill { opacity: 1; }

  /* ---- Chat ---- */
  #chat { grid-area: chat; display: flex; flex-direction: column; min-height: 0; }
  #stream { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .msg { margin-bottom: 18px; display: flex; gap: 0; position: relative; }
  .msg .avatar {
    width: 52px; flex: none; padding-top: 1px;
    font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--faint);
  }
  .msg.user .avatar { color: var(--cyan); }
  .msg.assistant .avatar {
    color: var(--pink);
    text-shadow: 0 0 10px var(--pink-dim);
  }
  .msg .body { min-width: 0; flex: 1; border-left: 1px solid var(--line); padding-left: 14px; }
  .msg.user .body { border-left-color: var(--line-2); }
  .msg.assistant .body {
    border-left-color: var(--pink);
    box-shadow: -1px 0 12px -6px var(--pink);
  }
  .msg .body .text { white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .msg.user .body .text { color: #F3E8FA; }
  .msg .meta {
    font-size: 9px; color: var(--faint); margin-top: 6px;
    letter-spacing: .1em; text-transform: uppercase;
  }

  .tool-card {
    border: 1px solid var(--line); background: var(--panel);
    padding: 0; margin: 8px 0;
    font-size: 11px;
  }
  .tool-card.err {
    border-color: var(--err);
    box-shadow: 0 0 14px -6px var(--err);
  }
  .tool-card .path {
    padding: 5px 9px; border-bottom: 1px solid var(--line);
    color: var(--text); letter-spacing: .02em;
    background: var(--panel-2); display: flex; justify-content: space-between;
  }
  .tool-card .path.err { color: var(--err); border-bottom-color: var(--err); }
  .tool-card .path .op {
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--pink); text-shadow: 0 0 8px var(--pink-dim);
  }
  .tool-card .path.err .op { color: var(--err); text-shadow: none; }
  .tool-card pre {
    margin: 0; padding: 8px 9px;
    white-space: pre-wrap; word-break: break-word;
    color: var(--muted); max-height: 190px; overflow: auto;
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
  }
  .tool-card pre.args { color: #B79BD0; border-bottom: 1px solid var(--line); }

  .thinking { display: flex; gap: 3px; padding: 4px 0; align-items: center; }
  .thinking::after {
    content: "执行中"; font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--pink); margin-left: 9px;
    text-shadow: 0 0 10px var(--pink-dim);
  }
  .thinking span {
    width: 18px; height: 2px; background: var(--pink); opacity: .2;
    animation: sweep 1.15s infinite;
    box-shadow: 0 0 8px var(--pink);
  }
  .thinking span:nth-child(2) { animation-delay: .14s; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .thinking span:nth-child(3) { animation-delay: .28s; }
  @keyframes sweep {
    0%, 100% { opacity: .12; }
    45% { opacity: 1; }
  }

  #composer {
    border-top: 1px solid var(--line-2); padding: 12px 16px 10px; background: var(--panel);
    box-shadow: 0 -1px 0 var(--pink-dim);
  }
  #composer .row { display: flex; gap: 8px; align-items: stretch; }
  #input {
    flex: 1; resize: none; min-height: 46px; max-height: 170px;
    font-family: var(--mono); line-height: 1.6; font-size: 13px;
  }
  #composer .hint {
    font-size: 10px; color: var(--faint); margin-top: 8px; letter-spacing: .06em;
  }
  kbd {
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 0 4px; font-family: var(--mono); font-size: 10px; color: var(--muted);
  }

  /* ---- Side ---- */
  #side {
    grid-area: side; background: var(--panel); border-left: 1px solid var(--line-2);
    display: flex; flex-direction: column; min-height: 0;
  }
  .tabs { display: flex; border-bottom: 1px solid var(--line-2); }
  .tabs button {
    flex: 1; border: none; border-right: 1px solid var(--line); border-radius: 0;
    background: none; padding: 11px 8px; color: var(--faint);
    letter-spacing: .14em; font-size: 10px;
  }
  .tabs button:last-child { border-right: none; }
  .tabs button:hover {
    color: var(--muted); border-color: var(--line); box-shadow: none;
  }
  .tabs button.active {
    color: var(--pink); background: var(--panel-2);
    box-shadow: inset 0 -2px 0 var(--pink), 0 0 18px -10px var(--pink);
    text-shadow: 0 0 10px var(--pink-dim);
  }
  .tab-body { flex: 1; overflow-y: auto; padding: 14px; }
  .tab-body.hidden { display: none; }

  .meter {
    height: 5px; background: var(--panel-2); overflow: hidden; margin: 7px 0 14px;
    border: 1px solid var(--line);
  }
  .meter > i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(to right, var(--pink), var(--cyan));
    box-shadow: 0 0 12px var(--pink-dim);
    transition: width .3s;
  }
  .meter.warn > i { background: linear-gradient(to right, #FF006E, #FFB000); }
  .meter.err > i { background: var(--err); box-shadow: 0 0 12px var(--err); }
  .kv {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; padding: 4px 0;
  }
  .kv .k {
    color: var(--faint); letter-spacing: .12em; text-transform: uppercase; font-size: 10px;
  }
  .kv .v { color: var(--text); }

  .trace-item { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
  .trace-item:last-child { border-bottom: none; }
  .trace-item .h { display: flex; gap: 8px; align-items: center; }
  .trace-item .t { color: var(--faint); font-size: 10px; }
  .trace-item .sum { color: var(--muted); margin-top: 3px; line-height: 1.5; word-break: break-word; }
  .tag {
    font-size: 9px; padding: 1px 5px; letter-spacing: .12em; text-transform: uppercase;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
  }
  .tag.assistant {
    color: var(--pink); border-color: var(--pink);
    box-shadow: 0 0 10px -4px var(--pink);
  }
  .tag.tool { color: var(--cyan); border-color: var(--cyan-dim); }
  .tag.route { color: var(--muted); border-color: var(--line-2); }
  .tag.error { color: var(--err); border-color: var(--err); }
  .tag.compress { color: #C77DFF; border-color: #C77DFF55; }
  .tag.state { color: var(--cyan); border-color: var(--cyan-dim); }
  .tag.usage { color: #C77DFF; border-color: #C77DFF55; }
  .tag.inject { color: #FFD166; border-color: #FFD16655; }

  .ctx-item {
    font-size: 11px; padding: 8px 9px; margin-bottom: 6px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-left: 2px solid var(--line-2);
  }
  .ctx-item .role {
    font-size: 9px; color: var(--pink); letter-spacing: .12em; text-transform: uppercase;
  }
  .ctx-item .c {
    white-space: pre-wrap; word-break: break-word; max-height: 92px;
    overflow: auto; margin-top: 4px; color: var(--muted); line-height: 1.5;
  }

  .empty {
    color: var(--faint); font-size: 10px; text-align: center; padding: 28px 8px;
    letter-spacing: .14em; text-transform: uppercase;
  }
  #banner {
    display: none; margin: 12px 22px 0; padding: 9px 11px;
    background: #2A0018; border: 1px solid var(--err); color: #FF9EB5; font-size: 11px;
    box-shadow: 0 0 18px -8px var(--err);
  }

  @media (max-width: 1180px) {
    body { grid-template-columns: 216px 1fr 296px; }
    .sess { padding-left: 52px; }
    .sess::before { width: 26px; left: 8px; font-size: 17px; }
  }
  @media (max-width: 900px) {
    body {
      grid-template-columns: 1fr; grid-template-rows: 52px 1fr auto;
      grid-template-areas: "head" "chat" "side";
    }
    #sessions { display: none; }
    #side { border-left: none; border-top: 1px solid var(--line-2); max-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Harness</h1>
  <span class="dot" id="health-dot" title="服务状态"></span>
  <span id="health-text">连接中</span>
  <div class="spacer"></div>
  <label for="model-select">模型</label>
  <select id="model-select" title="新建会话使用的模型"></select>
  <button id="new-session" class="primary">新建会话</button>
</header>

<aside id="sessions">
  <div class="top">
    <span class="k">会话</span><span class="v" id="sess-count">0</span>
  </div>
  <div id="session-list"><div class="empty">暂无会话</div></div>
</aside>

<main id="chat">
  <div id="banner"></div>
  <div id="stream"><div class="empty">选择或新建一个会话</div></div>
  <div id="composer">
    <div class="row">
      <textarea id="input" placeholder="输入消息"></textarea>
      <button id="send" class="primary">发送</button>
      <button id="stop" class="danger" disabled>中止</button>
    </div>
    <div class="hint">
      <kbd>Enter</kbd> 换行 &nbsp; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 等待插入 &nbsp; <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Enter</kbd> 立即插入
    </div>
  </div>
</main>

<aside id="side">
  <div class="tabs">
    <button data-tab="trace" class="active">轨迹</button>
    <button data-tab="context">上下文</button>
    <button data-tab="tools">工具</button>
  </div>
  <div class="tab-body" id="tab-trace">
    <div class="kv"><span class="k">上下文水位</span><span class="v" id="usage-text">—</span></div>
    <div class="meter" id="usage-meter"><i></i></div>
    <div id="trace-list"><div class="empty">暂无事件</div></div>
  </div>
  <div class="tab-body hidden" id="tab-context">
    <div class="kv"><span class="k">消息数</span><span class="v" id="ctx-count">0</span></div>
    <div class="kv"><span class="k">估算 token</span><span class="v" id="ctx-tokens">0</span></div>
    <div style="margin:10px 0 14px"><button id="refresh-context" style="width:100%">刷新上下文</button></div>
    <div id="ctx-list"><div class="empty">暂无消息</div></div>
  </div>
  <div class="tab-body hidden" id="tab-tools">
    <div id="tool-list"><div class="empty">加载中</div></div>
  </div>
</aside>

<script>
"use strict";

const MAX_TRACE = 300;
const state = {
  sessions: [],
  current: null,      // session id
  source: null,       // EventSource
  trace: [],
  usage: { tokens: 0, capacity: 0, ratio: 0 },
  models: [],
};

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

function escapeText(s) { return s == null ? "" : String(s); }

function fmtTime(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString("zh-CN", { hour12: false });
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = j.detail || detail; } catch {}
    throw new Error(detail);
  }
  return res.json();
}

function banner(msg) {
  const b = $("banner");
  if (!msg) { b.style.display = "none"; b.textContent = ""; return; }
  b.textContent = msg;
  b.style.display = "block";
  setTimeout(() => { b.style.display = "none"; }, 6000);
}

/* ---------------- 健康与模型 ---------------- */

async function loadHealth() {
  try {
    const h = await api("/api/health");
    $("health-dot").className = "dot " + (h.ok ? "ok" : "err");
    $("health-text").textContent = h.ok
      ? `就绪 ${h.sessions} 会话`
      : `未就绪 ${h.error || "未知原因"}`;
    if (!h.ok) banner(`服务未就绪：${h.error}。请检查 .env 中的 DEEPSEEK_API_KEY`);
    return h.ok;
  } catch (e) {
    $("health-dot").className = "dot err";
    $("health-text").textContent = "无法连接";
    return false;
  }
}

async function loadModels() {
  try {
    const data = await api("/api/models");
    state.models = data.models;
    const sel = $("model-select");
    sel.innerHTML = "";
    for (const m of data.models) {
      const o = el("option", null, m);
      o.value = m;
      if (m === data.default) o.selected = true;
      sel.appendChild(o);
    }
  } catch (e) { /* 未就绪时忽略 */ }
}

/* ---------------- 会话列表 ---------------- */

async function loadSessions() {
  const data = await api("/api/sessions");
  state.sessions = data.sessions;
  renderSessions();
}

function renderSessions() {
  const box = $("session-list");
  $("sess-count").textContent = state.sessions.length;
  if (!state.sessions.length) {
    box.innerHTML = "";
    box.appendChild(el("div", "empty", "暂无会话"));
    return;
  }
  box.innerHTML = "";
  state.sessions.forEach((s, i) => {
    const row = el("div", "sess" + (s.session_id === state.current ? " active" : ""));
    row.dataset.idx = String(state.sessions.length - i).padStart(3, "0");
    row.onclick = () => selectSession(s.session_id);

    const id = el("span", "id", s.session_id);
    const st = el("span", "st " + s.state, s.state);
    const kill = el("button", "kill", "删除");
    kill.title = "删除会话";
    kill.onclick = async (ev) => {
      ev.stopPropagation();
      await deleteSession(s.session_id);
    };
    row.append(id, st, kill);
    box.appendChild(row);
  });
}

async function createSession() {
  banner("");
  try {
    const model = $("model-select").value || null;
    const s = await api("/api/sessions", {
      method: "POST",
      body: JSON.stringify({ model }),
    });
    await loadSessions();
    await selectSession(s.session_id);
  } catch (e) { banner(`新建会话失败：${e.message}`); }
}

async function deleteSession(id) {
  try {
    await api(`/api/sessions/${id}`, { method: "DELETE" });
    if (state.current === id) { state.current = null; closeStream(); resetChat(); }
    await loadSessions();
  } catch (e) { banner(`删除失败：${e.message}`); }
}

async function selectSession(id) {
  if (state.current === id) return;
  state.current = id;
  state.trace = [];
  state.usage = { tokens: 0, capacity: 0, ratio: 0 };
  renderSessions();
  resetChat();
  renderTrace();
  updateUsage();

  try {
    const data = await api(`/api/sessions/${id}/messages`);
    state.usage.capacity = data.capacity;
    renderMessages(data.messages || []);
    updateUsage(data.tokens, data.capacity);
  } catch (e) { banner(`加载历史失败：${e.message}`); }

  openStream(id);
}

/* ---------------- 聊天区 ---------------- */

function resetChat() {
  const stream = $("stream");
  stream.innerHTML = "";
  stream.appendChild(el("div", "empty", "开始对话"));
}

function renderMessages(messages) {
  const stream = $("stream");
  stream.innerHTML = "";
  // SystemMsg 不上屏（内容过长且非对话）
  for (const m of messages) {
    if (m.role === "system") continue;
    if (m.role === "user") appendUser(m.content, m.ts);
    else if (m.role === "assistant") {
      for (const c of m.tool_calls || []) appendToolCall(c);
      if (m.content) appendAssistant(m.content, true, [], m.ts);
    } else if (m.role === "tool") appendToolResult(m.name, m.content, false);
  }
  scrollBottom();
}

function appendUser(text, ts) {
  const wrap = el("div", "msg user");
  const avatar = el("div", "avatar", "user");
  const body = el("div", "body");
  body.appendChild(el("div", "text", text));
  body.appendChild(el("div", "meta", ts ? fmtTime(ts) : ""));
  wrap.append(avatar, body);
  $("stream").appendChild(wrap);
  scrollBottom();
}

function appendAssistant(text, final, toolCalls, ts) {
  if (!text && !toolCalls.length) return;
  const wrap = el("div", "msg assistant");
  const avatar = el("div", "avatar", "agent");
  const body = el("div", "body");
  if (text) body.appendChild(el("div", "text", text));
  const label = final ? "final" : "reasoning";
  body.appendChild(el("div", "meta", ts ? `${label} ${fmtTime(ts)}` : label));
  wrap.append(avatar, body);
  $("stream").appendChild(wrap);
  scrollBottom();
}

function appendToolCall(call) {
  const card = el("div", "tool-card");
  const head = el("div", "path");
  head.append(el("span", null, call.name), el("span", "op", "call"));
  card.appendChild(head);
  card.appendChild(el("pre", "args", call.arguments || ""));
  $("stream").appendChild(card);
  scrollBottom();
}

function appendToolResult(path, content, isErr) {
  const card = el("div", "tool-card" + (isErr ? " err" : ""));
  const head = el("div", "path" + (isErr ? " err" : ""));
  head.append(el("span", null, path), el("span", "op", isErr ? "error" : "result"));
  card.appendChild(head);
  card.appendChild(el("pre", null, (content || "").slice(0, 1200)));
  $("stream").appendChild(card);
  scrollBottom();
}

function showThinking() {
  if ($("thinking")) return;
  const box = el("div", "msg assistant");
  const avatar = el("div", "avatar", "agent");
  const body = el("div", "body");
  const t = el("div", "thinking");
  t.id = "thinking";
  t.append(el("span"), el("span"), el("span"));
  body.appendChild(t);
  box.append(avatar, body);
  $("stream").appendChild(box);
  scrollBottom();
}

function hideThinking() {
  const t = $("thinking");
  if (t) t.parentElement.parentElement.remove();
}

function scrollBottom() {
  const s = $("stream");
  s.scrollTop = s.scrollHeight;
}

/* ---------------- SSE ---------------- */

function closeStream() {
  if (state.source) { state.source.close(); state.source = null; }
}

function openStream(id) {
  closeStream();
  const src = new EventSource(`/api/sessions/${id}/events`);
  state.source = src;

  src.onopen = () => { $("health-dot").className = "dot ok"; };

  src.onmessage = (ev) => {
    let data;
    try { data = JSON.parse(ev.data); } catch { return; }
    handleEvent(data);
  };

  src.onerror = () => {
    // 浏览器会自动重连；这里只更新指示器
    $("health-dot").className = "dot";
  };
}

function handleEvent(ev) {
  const { kind, payload, ts } = ev;
  pushTrace(kind, payload, ts);

  switch (kind) {
    case "assistant":
      hideThinking();
      if (payload.tool_calls && payload.tool_calls.length) {
        for (const c of payload.tool_calls) appendToolCall(c);
      }
      if (payload.content) appendAssistant(payload.content, payload.final, payload.tool_calls || [], ts);
      break;

    case "tool":
      hideThinking();
      appendToolResult(payload.path, payload.preview, false);
      break;

    case "route":
      break;

    case "compress":
      banner(`上下文已压缩（${payload.action}）`);
      break;

    case "inject":
      // 主消息已在本地渲染（send 时），这里只处理服务端主动插入的插话
      if (!payload.echo) appendUser(payload.text, ts);
      break;

    case "usage":
      updateUsage(payload.tokens, payload.capacity);
      break;

    case "state":
      updateSendState(payload.state);
      loadSessions().catch(() => {});
      if (payload.state === "running") showThinking();
      if (["done", "aborted", "error"].includes(payload.state)) hideThinking();
      break;

    case "error":
      hideThinking();
      banner(`推理错误：${payload.message}`);
      break;
  }
}

function updateSendState(stateName) {
  const running = stateName === "running";
  $("send").disabled = running;
  $("stop").disabled = !running;
}

/* ---------------- 轨迹 ---------------- */

function pushTrace(kind, payload, ts) {
  state.trace.push({ kind, payload, ts: ts || Date.now() / 1000 });
  if (state.trace.length > MAX_TRACE) state.trace.shift();
  renderTrace();
}

function renderTrace() {
  const box = $("trace-list");
  if (!state.trace.length) {
    box.innerHTML = "";
    box.appendChild(el("div", "empty", "暂无事件"));
    return;
  }
  box.innerHTML = "";
  for (const item of state.trace.slice().reverse()) {
    const row = el("div", "trace-item");
    const head = el("div", "h");
    head.append(
      el("span", "tag " + item.kind, item.kind),
      el("span", "t", fmtTime(item.ts)),
    );
    row.appendChild(head);
    row.appendChild(el("div", "sum", summarize(item)));
    box.appendChild(row);
  }
}

function summarize(item) {
  const p = item.payload || {};
  switch (item.kind) {
    case "assistant":
      return (p.content || p.text || "").slice(0, 90) || `tool_calls × ${(p.tool_calls || []).length}`;
    case "tool":
      return `${p.path} ${(p.preview || "").slice(0, 60)}`;
    case "route":
      return p.branch ? `分支 ${p.branch} 置信度 ${p.confidence}` : `回退全量 置信度 ${p.confidence}`;
    case "compress":
      return `${p.action} 剩余 ${p.messages} 条`;
    case "inject":
      return `[${p.channel}] ${(p.text || "").slice(0, 60)}`;
    case "usage":
      return `${p.tokens} / ${p.capacity} tokens`;
    case "state":
      return p.detail ? `${p.state} — ${p.detail}` : p.state;
    case "error":
      return p.message || "";
    default:
      return JSON.stringify(p).slice(0, 80);
  }
}

/* ---------------- 用量 ---------------- */

function updateUsage(tokens, capacity) {
  if (tokens !== undefined) state.usage.tokens = tokens;
  if (capacity !== undefined) state.usage.capacity = capacity;
  const { tokens: t, capacity: c } = state.usage;
  const ratio = c ? Math.min(1, t / c) : 0;
  state.usage.ratio = ratio;

  $("usage-text").textContent = c ? `${t} / ${c} (${(ratio * 100).toFixed(1)}%)` : "—";
  const meter = $("usage-meter");
  meter.className = "meter" + (ratio >= 0.85 ? " err" : ratio >= 0.75 ? " warn" : "");
  meter.firstElementChild.style.width = `${(ratio * 100).toFixed(1)}%`;
}

/* ---------------- 上下文 ---------------- */

async function refreshContext() {
  if (!state.current) return;
  try {
    const data = await api(`/api/sessions/${state.current}/messages`);
    $("ctx-count").textContent = (data.messages || []).length;
    $("ctx-tokens").textContent = data.tokens || 0;
    updateUsage(data.tokens, data.capacity);

    const box = $("ctx-list");
    box.innerHTML = "";
    if (!data.messages || !data.messages.length) {
      box.appendChild(el("div", "empty", "暂无消息"));
      return;
    }
    for (const m of data.messages) {
      const item = el("div", "ctx-item");
      item.appendChild(el("div", "role", m.role + (m.name ? " / " + m.name : "")));
      item.appendChild(el("div", "c", m.content || (m.tool_calls ? `[${m.tool_calls.length} tool_calls]` : "")));
      box.appendChild(item);
    }
  } catch (e) { banner(`刷新上下文失败：${e.message}`); }
}

/* ---------------- 工具面板 ---------------- */

async function loadTools() {
  const box = $("tool-list");
  try {
    const data = await api("/api/tools");
    box.innerHTML = "";
    if (!data.tools.length) { box.appendChild(el("div", "empty", "无已注册工具")); return; }
    for (const t of data.tools) {
      const item = el("div", "ctx-item");
      item.appendChild(el("div", "role", t.path));
      item.appendChild(el("div", "c", `${t.description} / 并发 ${t.concurrency}${t.idempotent ? " / 幂等" : ""}`));
      box.appendChild(item);
    }
  } catch (e) {
    box.innerHTML = "";
    box.appendChild(el("div", "empty", "加载失败：" + e.message));
  }
}

/* ---------------- 发送 ---------------- */

async function send(channel) {
  if (!state.current) { banner("请先新建或选择会话"); return; }
  const input = $("input");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  banner("");
  if (channel === "chat") appendUser(text);

  try {
    await api(`/api/sessions/${state.current}/messages`, {
      method: "POST",
      body: JSON.stringify({ text, channel }),
    });
    if (channel === "chat") { showThinking(); updateSendState("running"); }
  } catch (e) {
    banner(`发送失败：${e.message}`);
    updateSendState("idle");
  }
}

async function cancel() {
  if (!state.current) return;
  try {
    await api(`/api/sessions/${state.current}/cancel`, { method: "POST" });
    banner("已请求中止，将在下一个安全点生效");
  } catch (e) { banner(`中止失败：${e.message}`); }
}

/* ---------------- 事件绑定 ---------------- */

$("new-session").onclick = createSession;
$("send").onclick = () => send("chat");
$("stop").onclick = cancel;
$("refresh-context").onclick = refreshContext;

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    send(e.shiftKey ? "control" : "chat");
  }
});

for (const btn of document.querySelectorAll(".tabs button")) {
  btn.onclick = () => {
    for (const b of document.querySelectorAll(".tabs button")) b.classList.remove("active");
    btn.classList.add("active");
    for (const id of ["trace", "context", "tools"]) $("tab-" + id).classList.add("hidden");
    $("tab-" + btn.dataset.tab).classList.remove("hidden");
    if (btn.dataset.tab === "context") refreshContext();
    if (btn.dataset.tab === "tools") loadTools();
  };
}

/* ---------------- 启动 ---------------- */

(async function boot() {
  const ok = await loadHealth();
  if (ok) { await loadModels(); await loadSessions(); await loadTools(); }
  setInterval(loadHealth, 15000);
})();
</script>
